name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
        working-directory: packages/sdk
      - run: npm run typecheck
        working-directory: packages/sdk
      - run: npm run lint
        working-directory: packages/sdk
      - run: npm test
        working-directory: packages/sdk
      # Also enforces the gzip size budget via the `size` script.
      - run: npm run build
        working-directory: packages/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: packages/sdk/dist
          retention-days: 7

  gateway:
    name: Gateway (test, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
        working-directory: services/copilot-gateway

  e2e:
    name: End-to-end (demo host + gateway)
    runs-on: ubuntu-latest
    needs: [sdk, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build SDK bundle
        run: |
          npm ci --prefix packages/sdk
          npm run build:sdk

      - name: Start gateway (dev profile, mock LLM)
        working-directory: services/copilot-gateway
        env:
          SPRING_PROFILES_ACTIVE: dev
          COPILOT_MOCK_LLM: "true"
          # The whole suite runs as one demo user; the default 20/min per-user limit
          # would intermittently 429 the later tests.
          COPILOT_RATE_USER: "500"
        run: |
          mvn -B -q -DskipTests package
          nohup java -jar target/*.jar > /tmp/gateway.log 2>&1 &
          # Must fail the step when the service never comes up, otherwise E2E runs
          # against a dead gateway and reports opaque connection errors instead.
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/v1/health; then
              echo "gateway ready"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy in time" >&2
          exit 1

      - name: Start demo host
        run: |
          npm ci --prefix apps/demo-host
          nohup npm run dev --prefix apps/demo-host -- --port 5173 > /tmp/demo.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "demo host ready"
              exit 0
            fi
            sleep 2
          done
          echo "demo host did not become reachable in time" >&2
          exit 1

      - name: Run browser E2E
        run: |
          npm ci --prefix tests/e2e
          npx --prefix tests/e2e playwright install --with-deps chromium
          npm test --prefix tests/e2e

      - name: Gateway logs on failure
        if: failure()
        run: tail -100 /tmp/gateway.log /tmp/demo.log
