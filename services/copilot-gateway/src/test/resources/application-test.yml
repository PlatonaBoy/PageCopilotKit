spring:
  datasource:
    url: jdbc:h2:mem:copilot-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true

copilot:
  jwt-secret: test-secret-key-with-at-least-32-bytes!!
  cors-allowed-origins: http://localhost:5173
  cors-allow-all-patterns: false
  llm:
    mock: true
  rate-limit:
    # Disabled so the integration suite is not throttled by its own volume.
    enabled: false

logging:
  level:
    com.enterprise.copilot: WARN
